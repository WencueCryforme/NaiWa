# 依据 dist 目录的层级结构生成各级 manifest 与分类 catalog,并以机器人身份回传仓库
# 本工作流是可复用工作流(on: workflow_call),不自行触发,由 while-push-dist-or-pages.yml 按顺序调用
# 回传仓库需要调用方授予 contents: write 权限(入口工作流已授予)
# 脚本按拼音升序排列条目,排序依赖 pypinyin,故固定版本安装以保证同一份 dist 生成结果逐字节一致
name: 生成manifest与catalog
on:
  workflow_call:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
      - name: 搭建Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装脚本依赖
        run: pip install "pypinyin==0.55.0"
      - name: 生成各级manifest
        run: python scripts/gen_manifest.py
      - name: 合并生成catalog
        run: python scripts/gen_catalog.py
      - name: 以机器人身份提交catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f catalog
          if git diff --cached --quiet; then
            echo "catalog 无变化,跳过提交"
          else
            git commit -m "chore: regenerate catalog from dist"
            git push
          fi
